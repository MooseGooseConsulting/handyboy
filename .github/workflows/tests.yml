name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            host/pnpm-lock.yaml
      - name: Install extension dependencies
        run: pnpm install --frozen-lockfile
      - name: Install host dependencies
        run: pnpm --dir host install --frozen-lockfile
      - name: Typecheck extension
        run: pnpm typecheck
      - name: Test extension and existing invariants
        run: pnpm test
      - name: Typecheck host
        run: pnpm --dir host typecheck
      - name: Test host
        run: pnpm --dir host test
